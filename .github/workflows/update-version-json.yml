name: Update version.json

# Keeps version.json (the app's rate-limit-free update metadata fallback served
# by raw.githubusercontent.com) in sync every time a release is published.
# Because version.json is committed to main, it can never silently drift from
# the actual latest release as long as this runs — see /RELEASING.md.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate version.json
        id: generate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.parse
          import urllib.request

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "hh-version-writer",
                      "Authorization": f"token {token}",
                  },
              )
              return json.load(urllib.request.urlopen(req))

          rel = api(f"/releases/tags/{urllib.parse.quote(tag)}")
          assets = rel.get("assets") or []

          # Prefer the fixed, version-independent name; fall back to any .apk.
          apk = next((a for a in assets if a["name"] == "HappyHearts.apk"), None)
          if apk is None:
              apk = next((a for a in assets if a["name"].lower().endswith(".apk")), None)
          if apk is None:
              print("::error::no .apk asset found on release " + tag)
              raise SystemExit(1)

          data = {
              "tag_name": rel.get("tag_name"),
              "apk_name": apk["name"],
              "apk_size": int(apk.get("size") or -1),
              "notes": rel.get("body") or "",
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("version.json updated:")
          print(json.dumps(data, ensure_ascii=False))
          EOF

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then
            echo "version.json unchanged — nothing to commit"
          else
            git commit -m "chore: update version.json for ${RELEASE_TAG}"
            git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)
          fi